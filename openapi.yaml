  /v1/enrollments:
    post:
      operationId: createEnrollment
      tags: [Web]
      summary: Головна операція запису студента на групу вибіркової дисципліни в одній транзакції БД (О1.4, Д1.1, Д1.5 Web)
      description: |
        Виконує перевірку інваріантів (вікно `[opens_at, closes_at)`, ліміт K дисциплін, ліміт `30.0` ЄКТС, наявність вільних місць),
        зменшення `discipline_group.available` та створення запису `enrollment` в одній транзакції PostgreSQL.
        Власник визначається виключно із заголовка `X-User-Id` (передача `student_id` у тілі повертає `422`).
      x-course: main
      parameters:
        - $ref: "#/components/parameters/XRequestIdHeader"
        - $ref: "#/components/parameters/XUserIdRequiredHeader"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/TraceparentHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWebEnrollmentRequest"
            examples:
              normal:
                summary: Звичайний запис у відкриту групу
                value:
                  group_id: "DISC-WEB-01"
              scarce:
                summary: Запис у групу з одним вільним місцем (перевірка race condition)
                x-capacity: 1
                value:
                  group_id: "DISC-ONE-SEAT"
              missing:
                summary: Спроба запису у неіснуючу групу (очікується 404 Not Found)
                value:
                  group_id: "DISC-NON-EXISTENT"
      responses:
        "201":
          description: Запис успішно створено після COMMIT транзакції БД
          headers:
            Location:
              description: URI створеного ресурсу запису
              schema:
                type: string
              example: "/v1/enrollments/8f14e45f-ceea-467a-9a38-1b241d45b001"
            X-Request-ID:
              $ref: "#/components/headers/XRequestIdResponseHeader"
            X-Instance-Id:
              $ref: "#/components/headers/XInstanceIdResponseHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebEnrollmentResponse"
              example:
                id: "8f14e45f-ceea-467a-9a38-1b241d45b001"
                student_id: "student-1"
                group_id: "DISC-WEB-01"
                discipline_id: "DISC-WEB"
                discipline_title: "Обмін даними у Web-застосунках"
                ects: 6.0
                status: "held"
                version: 1
                created_at: "2026-10-30T08:15:00Z"
                expires_at: "2026-10-30T08:30:00Z"
                created_at_local: "2026-10-30T10:15:00+02:00"
                expires_at_local: "2026-10-30T10:30:00+02:00"
                university_tz: "Europe/Kyiv"
                instance_id: "app-a"
                extra_server_field: "forward_compatible_o1_7"
        "400":
          description: Синтаксично некоректний JSON або відсутній обов'язковий заголовок X-User-Id
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              example:
                type: "https://urn.c10.edu.ua/problems/missing_user_header"
                title: "Відсутній обов'язковий заголовок X-User-Id"
                status: 400
                detail: "До введення автентифікації в ЛР3 ідентифікатор студента має обов'язково передаватися у заголовку X-User-Id."
                instance: "/v1/enrollments"
                error_code: "missing_user_header"
                request_id: "req-400-demo"
        "404":
          description: Навчальну групу або студента не знайдено
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              example:
                type: "https://urn.c10.edu.ua/problems/group_not_found"
                title: "Групу дисципліни не знайдено"
                status: 404
                detail: "Група з ідентифікатором 'DISC-UNKNOWN' не існує."
                instance: "/v1/enrollments"
                error_code: "group_not_found"
                request_id: "req-404-demo"
        "409":
          description: Конфлікт стану (немає вільних місць у групі або повторний запис на ту саму дисципліну)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              example:
