  /v1/enrollments/{id}/registrations:
    post:
      operationId: registerEnrollmentToDecanate
      tags: [Web, DPC]
      summary: Асинхронна реєстрація попереднього запису у відомості деканату через чергу РПО (Web C10, стор. 37)
      description: |
        Спільна наскрізна операція Web + РПО за темою C10. Приймає запис студента у стані held,
        перевіряє його валідність і ставить у чергу воркерів РПО для внесення до офіційної відомості
        деканату (decanate_roster) та фіксації статусу confirmed.

        Семантичне розмежування:
        - POST /v1/enrollments/{id}/registrations — штатна інтеграція Web + РПО (внесення `held`-запису до `decanate_roster` через чергу з переходом у `confirmed`).
        - POST /v1/enrollments/{id}/confirm — повторна фіксація або завершення переходу `held -> confirmed` лише за наявності запису в `decanate_roster` (інакше повертає `409 roster_registration_required`).

        Якщо запис вже переведено у confirmed, повторний виклик повертає
        409 Conflict (enrollment_not_held), оскільки запис уже підтверджено і він не може потрапити до відомості двічі.

        Підтримка Idempotency-Key:
        - При повторі з тим самим Idempotency-Key повертається 202 Accepted зі збереженим requestId і Location
          як до початку обробки, так і після її завершення (done), без додаткового споживання слотів черги.
        - При зміні параметрів (студент, запис) повертається 409 Conflict (idempotency_conflict).
      x-course: long-operation
      security:
        - webBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Рядковий UUID Web-запису студента
          schema:
            type: string
        - $ref: "#/components/parameters/XRequestIdHeader"
        - $ref: "#/components/parameters/TraceparentHeader"
        - name: Idempotency-Key
          in: header
          required: false
          description: Необов'язковий ключ ідемпотентності
          schema:
            type: string
      responses:
        "202":
          description: Заявку прийнято в чергу на обробку
          headers:
            Location:
              description: URL для опитування стану обробки заявки
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DpcEnrollmentAcceptedResponse"
        "400":
          description: Некоректний ідентифікатор запису
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Відсутній або недійсний Bearer-токен Web-сесії
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: Запис не знайдено або належить іншому користувачу
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "409":
          description: Запис не перебуває у стані held або вже зареєстрований
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "429":
          description: Черга запитів переповнена (Backpressure)
          headers:
            Retry-After:
              description: Час очікування перед повтором запиту (секунди)
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "503":
          description: Сервіс завершує роботу (SIGTERM)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

