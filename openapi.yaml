  /v1/admin/reset:
    post:
      operationId: resetTestEnvironment
      tags: [Shared]
      summary: Стендове скидання даних та перемикання режимів дослідів (лише при ALLOW_TEST_OVERRIDES=true)
      description: Очищує заявки й записи, відновлює `discipline_group.available = seats` та скидає метрики. У штатному режимі (`ALLOW_TEST_OVERRIDES=false`) повертає `403 Forbidden`.
      x-course: shared
      security:
        - bearerAuth: []
      parameters:
        - name: unsafeMode
          in: query
          required: false
          description: Увімкнути або вимкнути демонстраційний небезпечний режим О1.4 на групі DISC-TEST-UNSAFE
          schema:
            type: boolean
        - name: metricsOnly
          in: query
          required: false
          description: Перезапустити лише вікно вимірювань закону Літтла після 10 с розігріву (Д1.2)
          schema:
            type: boolean
        - name: executionModel
          in: query
          required: false
          description: Перемкнути модель пулу воркерів між async_tasks та dedicated_threads (Д1.1)
          schema:
            type: string
            enum: [async_tasks, dedicated_threads]
      responses:
        "200":
          description: Стенд успішно скинуто до початкового стану
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminResetResponse"
              example:
                message: "Стан груп, дисциплін, студентів, черги, заявок та метрик успішно скинуто."
                unsafe_mode: false
                execution_model: "async_tasks"
                instance_id: "app-a"
        "401":
          description: Відсутній або недійсний Bearer-токен
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "403":
          description: Стендовий режим вимкнено за замовчуванням (ALLOW_TEST_OVERRIDES=false)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /metrics:
    get:
      operationId: getServiceMetrics
      tags: [DPC]
      summary: Метрики черги, перцентилі p50/p95/p99 та перевірка закону Літтла L = lambda * W (О1.5, Д1.2 РПО)
      description: Повертає детальний JSON-звіт (включно з часовим зважуванням та незалежною 100-мс вибіркою довжини черги) або текстовий формат Prometheus (`?format=prometheus`).
      x-course: dpc
      parameters:
        - name: format
          in: query
          required: false
          description: Формат виводу метрик (`json` або `prometheus`)
          schema:
            type: string
            enum: [json, prometheus]
            default: json
      responses:
        "200":
          description: Знімок метрик у форматі JSON або Prometheus
          content:
            application/json:
              example:
                queue_length: 0
                in_processing: 0
                littles_law:
                  observation_window_sec: 50.52
                  lambda_arrival_rate_rps: 3.959
                  w_avg_queue_wait_sec: 0.0861
                  l_theoretical_avg_queue_length: 0.3409
                  l_observed_avg_queue_length: 0.3409
                  l_observed_independent_sampled: 0.3451
                  independent_sample_count: 505
            text/plain:
              example: |
                # HELP dpc_queue_length Поточна довжина черги запитів
                # TYPE dpc_queue_length gauge
                dpc_queue_length 0
