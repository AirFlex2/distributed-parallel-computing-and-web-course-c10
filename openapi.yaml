  /v1/enrollment-requests:
    post:
      operationId: enqueueDpcEnrollmentRequest
      tags: [DPC]
      summary: Приймання заявки у внутрішню обмежену чергу з негайною відповіддю 202 Accepted (О1.1, О1.2, Д1.4 РПО)
      description: >-
        Перевіряє місткість обмеженої черги QUEUE_CAPACITY, зберігає запис зі статусом queued у PostgreSQL і ставить задачу у внутрішню чергу з підтримкою заголовка Idempotency-Key (або request_id у тілі).
        Повторний запит із тим самим ключем і незмінними параметрами повертає статус раніше збереженої заявки (202 Accepted) навіть за умови повного заповнення черги.
        Якщо ключ повторюється з іншими параметрами student_id або group_id, повертається помилка 409 Conflict.
        Нові заявки за умови переповнення черги негайно отримують 429 Too Many Requests із заголовком Retry-After.
      x-course: receiver
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Довільний строковий ключ ідемпотентності клієнта (максимум 128 символів). Пріоритет над полем request_id у тілі.
          schema:
            type: string
            maxLength: 128
          example: "idem-req-user-12345"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDpcEnrollmentRequest"
            examples:
              normal:
                summary: Постановка заявки в чергу РПО
                value:
                  student_id: "student-1"
                  group_id: "DISC-DPC-01"
                  request_id: "{uuid}"
      responses:
        "202":
          description: Заявку збережено в БД зі статусом queued і поставлено у внутрішню чергу (або повернено збережену заявку при повторі Idempotency-Key, у тому числі при заповненій черзі)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DpcEnrollmentAcceptedResponse"
              example:
                id: "7c9e6679-7425-40de-944b-e07fc1f90ae7"
                student_id: "student-1"
                group_id: "DISC-DPC-01"
                status: "queued"
                created_at: "2026-11-01T12:00:00Z"
        "400":
          description: Синтаксична помилка JSON або довжина Idempotency-Key перевищує 128 символів
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Відсутній або недійсний Bearer-токен
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: Навчальну групу або студента не знайдено в базі даних
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "409":
          description: Конфлікт даних повторного запиту з тим самим Idempotency-Key або request_id (idempotency_conflict)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "422":
          description: Помилка валідації доменних інваріантів або подання заявки на інтерактивну групу Web-контуру (dpc_sandbox_disabled)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "429":
          description: Обмежена черга заповнена (Backpressure), повертається заголовок Retry-After
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfterHeader"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              example:
                type: "https://urn.c10.edu.ua/problems/queue_overflow"
                title: "Черга запитів переповнена (Backpressure)"
                status: 429
                detail: "Перевищено місткість обмеженої черги QUEUE_CAPACITY (100). Спробуйте повторити запит через 1 секунду."
                instance: "/v1/enrollment-requests"
                error_code: "queue_overflow"
                request_id: "req-429-overflow-demo"
                instance_id: "app-a"
                timestamp_utc: "2026-11-01T12:00:00Z"
        "503":
          description: Сервіс отримав сигнал SIGTERM і завершує поточні задачі
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

