openapi: 3.1.0
info:
  title: "C10: Запис на вибіркові дисципліни — Спільний контракт API (Web + РПО, ЛР1–ЛР3)"
  version: "1.3.0"
  description: |
    Єдиний контракт API у форматі OpenAPI 3.1 для спільної теми **С10 «Запис на вибіркові дисципліни»**:
    - **Курс «Обмін даними у Web-застосунках» (ЛР1–ЛР3)**:
      - **ЛР1 (О1.1–О1.7, Д1.1–Д1.5)** та **ЛР2 (О2.1–О2.4)**: атомарна транзакція `POST /v1/enrollments`, курсорне пагінування, `Idempotency-Key`, контрольовані відмови `/faults`, ретраї клієнта.
      - **ЛР3 (О3.1–О3.4)**:
        - Серверна автентифікація з непрозорими Bearer-токенами (`POST /v1/auth/login`, `POST /v1/auth/logout`, `GET /v1/me`) та повною відмовою від довіри до `X-User-Id`;
        - Об'єктна авторизація власника (`404` для чужих і відсутніх об'єктів, `422` при спробі передати `student_id`/`status` у тілі), `PATCH /v1/enrollments/{id}` та рольовий доступ персоналу (`role: staff`) на `POST /v1/groups/{id}/close`;
        - Явний CORS із фіксованими origin-ами та сценарій входу/виходу в клієнті.
    - **Курс «Розподілені та паралельні обчислення» (ЛР1–ЛР3)**:
      - **ЛР1–ЛР2**: обмежена черга `POST /v1/enrollment-requests`, інваріант `taken <= seats`, метрики Літтла, `SIGTERM`, паралельне чисельне інтегрування `POST /v1/compute`.
      - **ЛР3 (О3.1–О3.4)**:
        - Розподілене виконання задач у **Ray** (`ray-head`, `ray-worker`), обмеження кількості незавершених задач (`IN_FLIGHT_LIMIT`) до вибирання з черги;
        - Відокремлений приймач результатів (Result Receiver) з атомарним журналом ефектів `dpc_applied_effects` за ключем `request_id` та відновленням після `/faults/after_effect_before_ack`.

servers:
  - url: http://localhost:8080
    description: Вхідна точка через балансувальник навантаження Nginx (порт 8080)
  - url: http://localhost:8000
    description: Альтернативна стандартна вхідна точка Nginx (порт 8000)

tags:
  - name: Shared
    description: Спільні службові та стендові маршрути обох курсів (ЛР1–ЛР3)
  - name: Web
    description: Маршрути курсу «Обмін даними у Web-застосунках» (ЛР1–ЛР3)
  - name: DPC
    description: Маршрути курсу «Розподілені та паралельні обчислення» (ЛР1–ЛР3)

components:
  securitySchemes:
    webBearerAuth:
      type: http
      scheme: bearer
      description: Непрозорий Bearer-токен Web-сесії користувача (`user` або `staff`), отриманий через `POST /v1/auth/login`
    bearerAuth:
      type: http
      scheme: bearer
      description: Службовий Bearer-токен контуру РПО (`API_AUTH_TOKEN`, суворо відокремлений від користувацьких Web-токенів)

  parameters:
    XRequestIdHeader:
      name: X-Request-ID
      in: header
      required: false
      description: Наскрізний ідентифікатор HTTP-запиту (О1.6 Web). Якщо не передано клієнтом — генерується сервером і повертається у відповіді.
      schema:
        type: string
      example: "req-c10-2026-0001"
    TraceparentHeader:
      name: traceparent
      in: header
      required: false
      description: Заголовок W3C Trace Context для трасування (Д1.4 Web). Валідний trace-id записується в однорядковий JSON-журнал.
      schema:
        type: string
      example: "00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01"
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Обов'язковий ключ ідемпотентності клієнта (О1.4, О2.2 Web). Повтор із тим самим ключем повертає збережений результат
      schema:
        type: string
        maxLength: 128
      example: "idem-req-user-12345"

  headers:
    XRequestIdResponseHeader:
      description: Наскрізний ідентифікатор запиту (О1.6 Web)
      schema:
        type: string
    XInstanceIdResponseHeader:
      description: Ідентифікатор екземпляра додатка за балансувальником nginx (`app-a` або `app-b`)
      schema:
        type: string
        enum: [app-a, app-b]
    RetryAfterHeader:
      description: Рекомендована пауза у секундах перед повторною спробою при переповненні черги (О1.2 РПО)
      schema:
        type: string
      example: "1"

  schemas:
    WebLoginRequest:
      type: object
      required: [login, password]
      properties:
        login:
          type: string
        password:
          type: string
          format: password

    WebUserProfile:
      type: object
      required: [id, username, email, full_name, role]
      properties:
        id:
          type: string
        username:
          type: string
        email:
          type: string
        full_name:
          type: string
        role:
          type: string
          enum: [user, staff]
        student_id:
          type: [string, "null"]

    WebLoginResponse:
      type: object
      required: [access_token, token_type, expires_in, expires_at, user]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
        expires_at:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/WebUserProfile"

    WebMeResponse:
      type: object
      required: [authenticated, user]
      properties:
        authenticated:
          type: boolean
        user:
          $ref: "#/components/schemas/WebUserProfile"

    WebLogoutResponse:
      type: object
      required: [logged_out, detail]
      properties:
        logged_out:
          type: boolean
        detail:
          type: string

    PatchWebEnrollmentRequest:
      type: object
      required: [group_id]
      properties:
        group_id:
          type: string

    ProblemDetails:
      type: object
      description: Повідомлення про помилку у форматі RFC 9457 Problem Details (application/problem+json)
      required: [type, title, status, detail, instance]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        error_code:
          type: string
        request_id:
          type: string
        instance_id:
          type: string
        timestamp_utc:
          type: string
          format: date-time

    HealthResponse:
      type: object
      required: [status, instance_id, timestamp_utc, queue_length, queue_capacity, allow_test_overrides]
      properties:
        status:
          type: string
          enum: [ok, shutting_down]
        instance_id:
          type: string
        timestamp_utc:
          type: string
          format: date-time
        queue_length:
          type: integer
        queue_capacity:
          type: integer
        allow_test_overrides:
          type: boolean

    WebStudent:
      type: object
      required: [id, email, full_name, max_disciplines, active_count, active_ects, max_ects]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        full_name:
          type: string
        max_disciplines:
          type: integer
        active_count:
          type: integer
        active_ects:
          type: number
        max_ects:
          type: number

    WebStudentListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WebStudent"

    CreateWebEnrollmentRequest:
      type: object
      required: [group_id]
      properties:
        group_id:
          type: string
          description: Рядковий ідентифікатор групи вибіркової дисципліни (посилання на discipline_group.id). Поле student_id у тілі заборонено (422).

    WebEnrollmentResponse:
      type: object
      required:
        - id
        - student_id
        - group_id
        - discipline_id
        - discipline_title
        - ects
        - status
        - version
        - created_at
        - expires_at
        - created_at_local
        - expires_at_local
        - university_tz
      properties:
        id:
          type: string
          description: Рядковий UUID запису студента на дисципліну (О1.4)
        student_id:
          type: string
        group_id:
          type: string
        discipline_id:
          type: string
        discipline_title:
          type: string
        ects:
          type: number
          description: Точна кількість кредитів ЄКТС дисципліни (numeric(3,1))
        status:
          type: string
          enum: [held, confirmed, expired, cancelled]
        version:
          type: integer
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        created_at_local:
          type: string
          description: Час створення у часовому поясі університету (Europe/Kyiv, ISO 8601)
        expires_at_local:
          type: string
          description: Час закінчення утримання місця у часовому поясі університету (Europe/Kyiv, ISO 8601)
        university_tz:
          type: string
          example: "Europe/Kyiv"
        instance_id:
          type: string
          example: "app-a"
        extra_server_field:
          type: string
          description: Додаткове поле для перевірки ігнорування невідомих полів клієнтом (О1.7)

    WebEnrollmentListResponse:
      type: object
      required: [items, next_cursor, limit, student_id, active_count, max_disciplines, active_ects, max_ects]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WebEnrollmentResponse"
        next_cursor:
          type: [string, "null"]
          description: Непрозорий курсор для переходу до наступної сторінки або null, якщо досягнуто кінця списку (О1.5)
        limit:
          type: integer
        student_id:
          type: string
        active_count:
          type: integer
        max_disciplines:
          type: integer
        active_ects:
          type: number
        max_ects:
          type: number

    WebDisciplineGroup:
      type: object
      required: [id, discipline_id, group_code, seats, available, opens_at, closes_at, opens_at_local, closes_at_local, university_tz, closed, window_active]
      properties:
        id:
          type: string
        discipline_id:
          type: string
        group_code:
          type: string
        seats:
          type: integer
        available:
          type: integer
        opens_at:
          type: string
          format: date-time
        closes_at:
          type: string
          format: date-time
        opens_at_local:
          type: string
        closes_at_local:
          type: string
        university_tz:
          type: string
        closed:
          type: boolean
        window_active:
          type: boolean

    WebDiscipline:
      type: object
      required: [id, code, title, ects, groups]
      properties:
        id:
          type: string
        code:
          type: string
        title:
          type: string
        ects:
          type: number
        groups:
          type: array
          items:
            $ref: "#/components/schemas/WebDisciplineGroup"

    WebDisciplineListResponse:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WebDiscipline"
        next_cursor:
          type: [string, "null"]

    CreateDpcEnrollmentRequest:
      type: object
      required: [student_id, group_id]
      properties:
        student_id:
          type: string
        group_id:
          type: string
        request_id:
          type: string
        enrollment_id:
          type: string
          format: uuid

    DpcEnrollmentAcceptedResponse:
      type: object
      required: [id, student_id, group_id, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        student_id:
          type: string
        group_id:
          type: string
        status:
          type: string
          enum: [queued, processing, done, rejected, failed]
        created_at:
          type: string
          format: date-time

    DpcEnrollmentStatusResponse:
      type: object
      required: [id, student_id, group_id, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        student_id:
          type: string
        group_id:
          type: string
        assigned_group_id:
          type: [string, "null"]
        recorded_in_roster:
          type: boolean
        status:
          type: string
          enum: [queued, processing, done, rejected, failed]
        rejection_reason:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time
        started_at:
          type: [string, "null"]
          format: date-time
        finished_at:
          type: [string, "null"]
          format: date-time
        first_read_at:
          type: [string, "null"]
          format: date-time
        queue_wait_ms:
          type: [number, "null"]
        processing_time_ms:
          type: [number, "null"]
        delivery_wait_ms:
          type: [number, "null"]

    GroupSeatsResponse:
      type: object
      required: [group_id, discipline_title, seats, taken, free_seats, invariant_holds]
      properties:
        group_id:
          type: string
        discipline_title:
          type: string
        seats:
          type: integer
        taken:
          type: integer
        free_seats:
          type: integer
        roster_count:
          type: integer
        invariant_holds:
          type: boolean
        capacity:
          type: integer
        used:
          type: integer

    DecanateRosterEntry:
      type: object
      required: [request_id, student_id, group_id, discipline_id, discipline_title, ects, assignment_type, created_at]
      properties:
        request_id:
          type: string
          format: uuid
        student_id:
          type: string
        group_id:
          type: string
        discipline_id:
          type: string
        discipline_title:
          type: string
        ects:
          type: number
        enrollment_id:
          type: [string, "null"]
        assignment_type:
          type: string
        created_at:
          type: string
          format: date-time

    AdminResetResponse:
      type: object
      required: [message, unsafe_mode]
      properties:
        message:
          type: string
        unsafe_mode:
          type: boolean
        instance_id:
          type: string

    IntervalStats:
      type: object
      required: [description, sample_count, mean_ms, p50_ms, p95_ms, p99_ms]
      properties:
        description:
          type: string
        sample_count:
          type: integer
        mean_ms:
          type: number
        p50_ms:
          type: number
        p95_ms:
          type: number
        p99_ms:
          type: number

    ServiceMetricsResponse:
      type: object
      required: [service, instance_id, timestamp_utc, configuration, queue_length, in_processing, counters, intervals_ms, littles_law]
      properties:
        service:
          type: string
        instance_id:
          type: string
        timestamp_utc:
          type: string
          format: date-time
        configuration:
          type: object
        queue_length:
          type: integer
        in_flight:
          type: integer
        in_processing:
          type: integer
        rejected:
          type: integer
        counters:
          type: object
        intervals_ms:
          type: object
          properties:
            queue_wait_ms:
              $ref: "#/components/schemas/IntervalStats"
            processing_time_ms:
              $ref: "#/components/schemas/IntervalStats"
            delivery_wait_ms:
              $ref: "#/components/schemas/IntervalStats"
            full_domain_execution_ms:
              $ref: "#/components/schemas/IntervalStats"
        littles_law:
          type: object

    ComputeRequest:
      type: object
      description: Параметри паралельного чисельного інтегрування функції інтенсивності потоку заявок C10 λ(t) = B + A·exp(-t/τ) на області визначення 0 <= a <= b <= T (РПО О2.1–О2.4)
      required: [a, b, n, workers]
      properties:
        a:
          type: number
          minimum: 0
          description: Нижня межа інтервалу інтегрування [a, b] у межах області визначення моделі C10 (0 <= a <= b <= T)
          example: 0.0
        b:
          type: number
          minimum: 0
          description: Верхня межа інтервалу інтегрування [a, b] у межах області визначення моделі C10 (0 <= a <= b <= T)
          example: 1.0
        n:
          type: integer
          minimum: 1
          description: Кількість підінтервалів розбиття методу трапецій
          example: 100000
        workers:
          type: integer
          enum: [1, 2, 4]
          description: Кількість окремих процесів ОС для паралельного обчислення (1, 2 або 4)
          example: 2
        method:
          type: string
          enum: [trapezoid]
          default: trapezoid
          description: Чисельний метод інтегрування (для ЛР2 — виключно trapezoid)
          example: "trapezoid"
        order:
          type: string
          enum: [natural]
          default: natural
          description: Порядок підсумовування елементів (для ЛР2 — виключно natural, за зростанням індексу зліва направо)
          example: "natural"
        mode:
          type: string
          enum: [none, lock, local]
          default: local
          description: Режим агрегації результатів між процесами для О2.4 (none — спільна сума без синхронізації, lock — спільна сума під блокуванням, local — локальні суми процесів)
          example: "local"
        kernel:
          type: string
          enum: [composite, naive]
          default: composite
          description: Варіант обчислювального ядра трапецій для експериментального порівняння О2.3 без профайлера, що підтримується в усіх режимах mode (local, lock, none). За замовчуванням composite — оптимізована складена формула зі спільними внутрішніми вузлами та попередньо обчисленим множником -1/τ; naive — базове поелементне обчислення з двома інлайненими викликами λ(t) на кожен підінтервал.
          example: "composite"
        model_a:
          type: number
          minimum: 0
          description: Амплітуда початкового сплеску інтенсивності потоку заявок A (за замовчуванням із конфігурації сервісу)
          example: 50.0
        model_b:
          type: number
          minimum: 0
          description: Фонова базова інтенсивність потоку заявок B (за замовчуванням із конфігурації сервісу)
          example: 5.0
        model_tau:
          type: number
          exclusiveMinimum: 0
          description: Характерний час загасання початкового сплеску τ > 0 (за замовчуванням із конфігурації сервісу)
          example: 10.0
        model_t:
          type: number
          exclusiveMinimum: 0
          description: Горизонт вікна запису T > 0 (за замовчуванням із конфігурації сервісу)
          example: 60.0

    ComputeResultDetails:
      type: object
      description: Вкладені деталі результату обчислення для сумісності з шаблоном автоперевірки РПО
      required: [value, reference, abs_error, error, rel_error, wall_s, duration_ms, workers, method, n, order, mode]
      properties:
        value:
          type: number
          description: Обчислене чисельне значення інтеграла I_n
        reference:
          type: number
          description: Аналітичне еталонне значення інтеграла I(a, b) = F(b) - F(a)
        abs_error:
          type: number
          description: Абсолютна похибка |I_n - I(a, b)|
        error:
          type: number
          description: Синонім абсолютної похибки |I_n - I(a, b)|
        rel_error:
          type: number
          description: Відносна похибка |I_n - I(a, b)| / max(|I(a, b)|, 1e-15)
        wall_s:
          type: number
          description: Повний час виконання обчислення в секундах (включно зі створенням процесів, IPC та збором результатів)
        duration_ms:
          type: number
          description: Повний час виконання обчислення в мілісекундах
        workers:
          type: integer
          enum: [1, 2, 4]
        method:
          type: string
          enum: [trapezoid]
        n:
          type: integer
          minimum: 1
        order:
          type: string
          enum: [natural]
        mode:
          type: string
          enum: [none, lock, local]

    ComputeResponse:
      type: object
      description: Відповідь синхронного паралельного чисельного інтегрування POST /v1/compute (РПО О2.1–О2.4)
      required: [value, reference, abs_error, error, rel_error, wall_s, duration_ms, workers, method, n, order, mode, a, b, state, instance_id, result]
      properties:
        value:
          type: number
          description: Обчислене чисельне значення інтеграла I_n
        reference:
          type: number
          description: Аналітичне еталонне значення інтеграла I(a, b) = F(b) - F(a)
        abs_error:
          type: number
          description: Абсолютна похибка |I_n - I(a, b)|
        error:
          type: number
          description: Синонім абсолютної похибки |I_n - I(a, b)|
        rel_error:
          type: number
          description: Відносна похибка |I_n - I(a, b)| / max(|I(a, b)|, 1e-15)
        wall_s:
          type: number
          description: Повний час виконання обчислення в секундах
        duration_ms:
          type: number
          description: Повний час виконання обчислення в мілісекундах
        workers:
          type: integer
          enum: [1, 2, 4]
        method:
          type: string
          enum: [trapezoid]
        n:
          type: integer
          minimum: 1
        order:
          type: string
          enum: [natural]
        mode:
          type: string
          enum: [none, lock, local]
        a:
          type: number
        b:
          type: number
        state:
          type: string
          enum: [done]
        instance_id:
          type: string
        result:
          $ref: "#/components/schemas/ComputeResultDetails"

paths:
  /:
    get:
      operationId: getApiDiscovery
      tags: [Shared]
      summary: Кореневий опис сервісу та перелік основних маршрутів API
      description: Повертає метадані екземпляра API та перелік доступних маршрутів. Окремий вебклієнт запускається поза Docker Compose (§1.2).
      responses:
        "200":
          description: Опис сервісу та маршрутів
          content:
            application/json:
              example:
                service: "C10 Enrollment Service (Web + DPC, Lab 1)"
                instance_id: "app-a"
                standalone_client: "Запустіть окремий клієнт поза Docker Compose: pwsh client/start_client.ps1 (http://localhost:3000)"

  /health:
    get:
      operationId: getHealth
      tags: [Shared]
      summary: Перевірка живучості сервісу (О1.6 Web та О1.2 РПО)
      description: Миттєво відповідає з пам'яті процесу без звернення до бази даних (p95 <= 100 мс під піковим навантаженням).
      parameters:
        - $ref: "#/components/parameters/XRequestIdHeader"
        - $ref: "#/components/parameters/TraceparentHeader"
      responses:
        "200":
          description: Сервіс живий і готовий приймати запити
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestIdResponseHeader"
            X-Instance-Id:
              $ref: "#/components/headers/XInstanceIdResponseHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: "ok"
                instance_id: "app-a"
                timestamp_utc: "2026-10-30T08:00:00Z"
                queue_length: 0
                queue_capacity: 100
                allow_test_overrides: false

  /health-app-a:
    get:
      operationId: getHealthAppA
      tags: [Shared]
      summary: Пряма перевірка живучості навантаженого екземпляра app-a (О1.2 РПО)
      description: Маршрутизується Nginx виключно на головний обчислювальний вузол `dpc_backend` (app-a), виключаючи ненавантажений app-b для чистоти вимірювання перцентиля затримки p95.
      parameters:
        - $ref: "#/components/parameters/XRequestIdHeader"
        - $ref: "#/components/parameters/TraceparentHeader"
      responses:
        "200":
          description: Вузол app-a живий і відповідає під час навантаження черги
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestIdResponseHeader"
            X-Instance-Id:
              $ref: "#/components/headers/XInstanceIdResponseHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: "ok"
                instance_id: "app-a"
                timestamp_utc: "2026-10-30T08:00:00Z"
                queue_length: 100
                queue_capacity: 100
                allow_test_overrides: false

  /health-app-b:
    get:
      operationId: getHealthAppB
      tags: [Shared]
      summary: Пряма перевірка живучості екземпляра app-b (О1.6 Web)
      description: Маршрутизується Nginx виключно на обчислювальний вузол `app-b` за балансувальником для ізольованої перевірки його стану та конфігурації.
      parameters:
        - $ref: "#/components/parameters/XRequestIdHeader"
        - $ref: "#/components/parameters/TraceparentHeader"
      responses:
        "200":
          description: Вузол app-b живий і відповідає
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestIdResponseHeader"
            X-Instance-Id:
              $ref: "#/components/headers/XInstanceIdResponseHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: "ok"
                instance_id: "app-b"
                timestamp_utc: "2026-10-30T08:00:00Z"
                queue_length: 0
                queue_capacity: 100
                allow_test_overrides: false

  /v1/auth/login:
    post:
      operationId: loginWebUser
      tags: [Web]
      summary: Вхід користувача або персоналу деканату (Web ЛР3 О3.1)
      description: Перевіряє логін і пароль (PBKDF2-SHA256) та видає серверний непрозорий Bearer-токен Web-сесії.
      parameters:
        - $ref: "#/components/parameters/XRequestIdHeader"
        - $ref: "#/components/parameters/TraceparentHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebLoginRequest"
            example:
              login: "student-1"
              password: "StudentPass2026!"
      responses:
        "200":
          description: Успішний вхід та видача токена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebLoginResponse"
        "400":
          description: Некоректне тіло запиту
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Невірний логін або пароль
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /v1/auth/logout:
    post:
      operationId: logoutWebUser
      tags: [Web]
      summary: Вихід користувача та відкликання токена на сервері (Web ЛР3 О3.1)
      description: Позначає непрозорий токен Web-сесії як відкликаний у PostgreSQL, роблячи його недійсним на app-a і app-b.
      security:
        - webBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XRequestIdHeader"
        - $ref: "#/components/parameters/TraceparentHeader"
      responses:
        "200":
          description: Токен відкликано
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebLogoutResponse"
        "401":
          description: Відсутній або недійсний токен Web-сесії
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /v1/me:
    get:
      operationId: getCurrentWebUser
      tags: [Web]
      summary: Отримання профілю та ролі поточного автентифікованого користувача (Web ЛР3 О3.1)
      description: Перевіряє непрозорий Bearer-токен Web-сесії у PostgreSQL та повертає ідентифікатор, роль (`user` або `staff`) і дані поточного користувача.
      security:
        - webBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XRequestIdHeader"
        - $ref: "#/components/parameters/TraceparentHeader"
      responses:
        "200":
          description: Інформація про поточного користувача
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebMeResponse"
        "401":
          description: Неавторизований запит
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /v1/students:
    get:
      operationId: listPrecreatedStudents
      tags: [Web]
      summary: Список студентів у БД із захистом персональних даних (Web О1.4, О3.2)
      description: |
        Повертає перелік студентів із дотриманням рольового доступу (RBAC) за Bearer-токеном Web-сесії:
        - Персонал (`role = staff`) може переглядати повний список студентів або фільтрувати за `?student_id=...`;
        - Студент (`role = user`) отримує виключно власний профіль (спроба запросити чужі дані повертає 403/404);
        - Анонімні запити та службовий токен РПО відхиляються зі статусом 401 Unauthorized.
      security:
        - webBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XRequestIdHeader"
        - $ref: "#/components/parameters/TraceparentHeader"
        - name: student_id
          in: query
          required: false
          description: Фільтрація за ідентифікатором студента (доступно персоналу або для власного ID студента)
          schema:
            type: string
      responses:
        "200":
          description: Список студентів (для персоналу — повний або відфільтрований, для студента — лише власний профіль)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebStudentListResponse"
              example:
                items:
                  - id: "student-1"
                    email: "timur.zinkivskyi@inf.edu.ua"
                    full_name: "Зінківський Тимур Євгенійович (ІТІНФ-23-2)"
                    max_disciplines: 5
                    active_count: 1
                    active_ects: 6.0
                    max_ects: 30.0
        "401":
          description: Неавторизований доступ (відсутній або недійсний Bearer-токен Web-сесії)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "403":
          description: Доступ заборонено (студент намагається переглянути чужі дані або використана недозволена роль)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /v1/students/{id}:
    get:
      operationId: getStudentById
      tags: [Web]
      summary: Отримання профілю конкретного студента (Web О3.2)
      description: |
        Повертає профіль студента за його ідентифікатором (тільки з дійсним Bearer-токеном Web-сесії):
        - Персонал (`role = staff`) може отримати профіль будь-якого студента;
        - Студент (`role = user`) може отримати виключно власний профіль (для чужого чи відсутнього повертається 404);
        - Неавтентифіковані запити відхиляються зі статусом 401 Unauthorized.
      security:
        - webBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Ідентифікатор студента
          schema:
            type: string
        - $ref: "#/components/parameters/XRequestIdHeader"
        - $ref: "#/components/parameters/TraceparentHeader"
      responses:
        "200":
          description: Профіль студента
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebStudent"
              example:
                id: "student-1"
                email: "timur.zinkivskyi@inf.edu.ua"
                full_name: "Зінківський Тимур Євгенійович (ІТІНФ-23-2)"
                max_disciplines: 5
                active_count: 1
                active_ects: 6.0
                max_ects: 30.0
        "401":
          description: Неавторизований доступ
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "403":
          description: Доступ заборонено (спроба переглянути чужий профіль)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: Студента не знайдено
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /v1/disciplines:
    get:
      operationId: listDisciplines
      tags: [Web]
      summary: Список вибіркових дисциплін із групами, часовими вікнами та актуальним залишком місць (О1.3, О1.5 Web)
      description: Читає каталог дисциплін і груп із єдиного спільного ресурсу discipline_group з підтримкою курсорної пагінації за id.
      parameters:
        - $ref: "#/components/parameters/XRequestIdHeader"
        - $ref: "#/components/parameters/TraceparentHeader"
        - name: limit
          in: query
          required: false
          description: Кількість дисциплін на сторінці (від 1 до 50)
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: cursor
          in: query
          required: false
          description: Непрозорий маркер курсора Base64 для отримання наступної сторінки дисциплін
          schema:
            type: string
        - name: after
          in: query
          required: false
          description: Непрозорий маркер курсора Base64 (синонім cursor)
          schema:
            type: string
      responses:
        "200":
          description: Список дисциплін та їхніх груп
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebDisciplineListResponse"
              example:
                items:
                  - id: "DISC-WEB"
                    code: "CS-402"
                    title: "Обмін даними у Web-застосунках"
                    ects: 6.0
                    groups:
                      - id: "DISC-WEB-01"
                        discipline_id: "DISC-WEB"
                        group_code: "WEB-G1"
                        seats: 25
                        available: 24
                        opens_at: "2025-01-01T08:00:00Z"
                        closes_at: "2027-12-31T20:00:00Z"
                        opens_at_local: "2025-01-01T10:00:00+02:00"
                        closes_at_local: "2027-12-31T22:00:00+02:00"
                        university_tz: "Europe/Kyiv"
                        closed: false
                        window_active: true
                next_cursor: null
        "400":
          description: Некоректний параметр limit
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /v1/enrollments:
    post:
      operationId: createEnrollment
      tags: [Web]
      summary: Головна операція запису студента на групу вибіркової дисципліни в одній транзакції БД (О1.4, Д1.1, Д1.5, О3.2 Web)
      description: |
        Виконує перевірку інваріантів (вікно `[opens_at, closes_at)`, ліміт K дисциплін, ліміт `30.0` ЄКТС, наявність вільних місць),
        зменшення `discipline_group.available` та створення запису `enrollment` в одній транзакції PostgreSQL.
        Студент-власник визначається виключно з серверної Web-сесії (`Authorization: Bearer <token>`, роль `user`); заголовок `X-User-Id` ігнорується, а передача `student_id`/`status` у тілі повертає `422`.
      x-course: main
      security:
        - webBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XRequestIdHeader"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/TraceparentHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWebEnrollmentRequest"
            examples:
              normal:
                summary: Звичайний запис у відкриту групу
                value:
                  group_id: "DISC-WEB-01"
              scarce:
                summary: Запис у групу з одним вільним місцем (перевірка race condition)
                x-capacity: 1
                value:
                  group_id: "DISC-ONE-SEAT"
              missing:
                summary: Спроба запису у неіснуючу групу (очікується 404 Not Found)
                value:
                  group_id: "DISC-NON-EXISTENT"
      responses:
        "201":
          description: Запис успішно створено після COMMIT транзакції БД
          headers:
            Location:
              description: URI створеного ресурсу запису
              schema:
                type: string
              example: "/v1/enrollments/8f14e45f-ceea-467a-9a38-1b241d45b001"
            X-Request-ID:
              $ref: "#/components/headers/XRequestIdResponseHeader"
            X-Instance-Id:
              $ref: "#/components/headers/XInstanceIdResponseHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebEnrollmentResponse"
              example:
                id: "8f14e45f-ceea-467a-9a38-1b241d45b001"
                student_id: "student-1"
                group_id: "DISC-WEB-01"
                discipline_id: "DISC-WEB"
                discipline_title: "Обмін даними у Web-застосунках"
                ects: 6.0
                status: "held"
                version: 1
                created_at: "2026-10-30T08:15:00Z"
                expires_at: "2026-10-30T08:30:00Z"
                created_at_local: "2026-10-30T10:15:00+02:00"
                expires_at_local: "2026-10-30T10:30:00+02:00"
                university_tz: "Europe/Kyiv"
                instance_id: "app-a"
                extra_server_field: "forward_compatible_o1_7"
        "400":
          description: Синтаксично некоректний JSON або порожнє тіло запиту
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              example:
                type: "https://urn.c10.edu.ua/problems/invalid_json_syntax"
                title: "Некоректний синтаксис JSON"
                status: 400
                detail: "Тіло запиту не є валідним JSON-об'єктом."
                instance: "/v1/enrollments"
                error_code: "invalid_json_syntax"
        "401":
          description: Відсутній або недійсний Bearer-токен Web-сесії
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "403":
          description: Роль автентифікованого користувача (за Web Bearer-токеном) не дозволяє створення студентського запису
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              example:
                type: "https://urn.c10.edu.ua/problems/forbidden"
                title: "Доступ заборонено"
                status: 403
                detail: "Ідентифікація виконується за Web Bearer-токеном; створення запису дозволено лише обліковим записам студентів (role = user)."
                instance: "/v1/enrollments"
                error_code: "forbidden"
                request_id: "req-403-demo"
        "404":
          description: Навчальну групу або студента не знайдено
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              example:
                type: "https://urn.c10.edu.ua/problems/group_not_found"
                title: "Групу дисципліни не знайдено"
                status: 404
                detail: "Група з ідентифікатором 'DISC-UNKNOWN' не існує."
                instance: "/v1/enrollments"
                error_code: "group_not_found"
                request_id: "req-404-demo"
        "409":
          description: Конфлікт стану (немає вільних місць у групі, повторний запис на ту саму дисципліну або операція за вказаним Idempotency-Key ще обробляється — idempotency_key_in_progress, Web О2.1, О2.2)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              examples:
                group_full:
                  summary: У групі немає вільних місць
                  value:
                    type: "https://urn.c10.edu.ua/problems/group_full"
                    title: "У групі немає вільних місць"
                    status: 409
                    detail: "Вичерпано ліміт місць у навчальній групі 'DISC-WEB-01' (доступно 0 місць)."
                    instance: "/v1/enrollments"
                    error_code: "group_full"
                    request_id: "req-409-demo"
                idempotency_in_progress:
                  summary: Операція з тим самим Idempotency-Key ще обробляється (Web О2.2)
                  value:
                    type: "https://urn.c10.edu.ua/problems/idempotency_key_in_progress"
                    title: "Операція за цим ключем ідемпотентності вже виконується"
                    status: 409
                    detail: "Запит із вказаним Idempotency-Key наразі перебуває в стані обробки (processing). Повторіть спробу пізніше."
                    instance: "/v1/enrollments"
                    error_code: "idempotency_key_in_progress"
                    request_id: "req-409-idem-in-progress"
        "422":
          description: Семантична неможливість обробки (перевищення семестрового ліміту ЄКТС або кількості дисциплін, запит поза часовим вікном, закрита група, невалідні поля або невідповідність корисного навантаження ключа Idempotency-Key О2.2)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              examples:
                ects_limit:
                  summary: Перевищення ліміту ЄКТС
                  value:
                    type: "https://urn.c10.edu.ua/problems/ects_limit_exceeded"
                    title: "Перевищено семестровий ліміт кредитів ЄКТС"
                    status: 422
                    detail: "Сума кредитів після запису становить 30.5 ЄКТС, що перевищує максимум 30.0 ЄКТС."
                    instance: "/v1/enrollments"
                    error_code: "ects_limit_exceeded"
                    request_id: "req-422-demo"
                idempotency_payload_mismatch:
                  summary: Повторний ключ Idempotency-Key з іншим тілом (Web О2.2)
                  value:
                    type: "https://urn.c10.edu.ua/problems/idempotency_key_payload_mismatch"
                    title: "Невідповідність корисного навантаження ключа ідемпотентності"
                    status: 422
                    detail: "Ключ Idempotency-Key вже використано для іншого запиту або іншого студента."
                    instance: "/v1/enrollments"
                    error_code: "idempotency_key_payload_mismatch"
                    request_id: "req-422-idem-demo"

    get:
      operationId: listStudentEnrollments
      tags: [Web]
