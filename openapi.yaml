                detail: "Вичерпано ліміт місць у навчальній групі 'DISC-WEB-01' (доступно 0 місць)."
                instance: "/v1/enrollments"
                error_code: "group_full"
                request_id: "req-409-demo"
        "422":
          description: Семантична неможливість обробки (перевищення семестрового ліміту ЄКТС або кількості дисциплін, запит поза часовим вікном, закрита група, невалідні поля або невідповідність корисного навантаження ключа Idempotency-Key О2.2)
