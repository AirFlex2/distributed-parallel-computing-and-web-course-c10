openapi: 3.1.0
info:
  title: "C10: Запис на вибіркові дисципліни — Спільний контракт API (Web + РПО, ЛР1)"
  version: "1.2.0"
  description: |
    Єдиний контракт API у форматі OpenAPI 3.1 для спільної теми **С10 «Запис на вибіркові дисципліни»**:
    - **Курс «Обмін даними у Web-застосунках» (ЛР1: О1.1–О1.7, Д1.1–Д1.5)**:
      - Головна операція `POST /v1/enrollments` (атомарна транзакція БД поверх єдиного ресурсу `discipline_group`, `201 Created` із заголовком `Location`, помилки `400`, `404`, `409`, `422` у форматі `Problem Details` RFC 9457);
      - Обов'язковий заголовок `X-User-Id` на користувацьких маршрутах (заборона визначення власника з тіла запиту);
      - Курсорне пагінування `GET /v1/enrollments?limit=...&after=...` за парою `(created_at DESC, id DESC)`;
      - Каталог дисциплін і груп `GET /v1/disciplines` із часовим вікном `[opens_at, closes_at)` (`Europe/Kyiv`) та кредитами ЄКТС (`<= 30.0`), довідник студентів `GET /v1/students`;
      - Скасування запису `POST /v1/enrollments/{id}/cancel` та закриття групи `POST /v1/groups/{id}/close`;
      - Наскрізний `X-Request-ID` та підтримка `traceparent` (W3C Trace Context).
    - **Курс «Розподілені та паралельні обчислення» (ЛР1: О1.1–О1.5, Д1.1–Д1.4)**:
      - Приймання заявок у внутрішню обмежену чергу `POST /v1/enrollment-requests` (`202 Accepted`, відсікання перевантаження `429 Too Many Requests` + `Retry-After: 1`, `503 Service Unavailable` під час SIGTERM);
      - Опитування стану заявки `GET /v1/enrollment-requests/{id}` із одноразовою фіксацією `first_read_at`;
      - Стан спільного ресурсу через SQL-представлення `VIEW group_seats` (`GET /v1/group-seats`, `GET /v1/group-seats/{id}`) та метрики черги і закону Літтла `GET /metrics`.

servers:
  - url: http://localhost:8080
    description: Вхідна точка через балансувальник навантаження Nginx (порт 8080)
  - url: http://localhost:8000
    description: Альтернативна стандартна вхідна точка Nginx (порт 8000)

tags:
  - name: Shared
    description: Спільні службові та стендові маршрути обох курсів
  - name: Web
    description: Маршрути курсу «Обмін даними у Web-застосунках» (ЛР1)
  - name: DPC
    description: Маршрути курсу «Розподілені та паралельні обчислення» (ЛР1)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Фіксований токен авторизації для маршрутів РПО (`secret-c10-token-2026`)

  parameters:
    XRequestIdHeader:
      name: X-Request-ID
      in: header
      required: false
      description: Наскрізний ідентифікатор HTTP-запиту (О1.6 Web). Якщо не передано клієнтом — генерується сервером і повертається у відповіді.
      schema:
        type: string
      example: "req-c10-2026-0001"
    XUserIdRequiredHeader:
      name: X-User-Id
      in: header
      required: true
      description: Обов'язковий ідентифікатор наперед створеного студента в БД до введення автентифікації в ЛР3 (О1.4 Web). Якщо відсутній — повертається 400 Bad Request Problem Details.
      schema:
        type: string
        minLength: 1
        maxLength: 64
      example: "student-1"
    XUserIdOptionalHeader:
      name: X-User-Id
      in: header
      required: false
      description: Опційний ідентифікатор користувача для запису в журнал запитів.
      schema:
        type: string
      example: "student-1"
    TraceparentHeader:
      name: traceparent
      in: header
      required: false
      description: Заголовок W3C Trace Context для трасування (Д1.4 Web). Валідний trace-id записується в однорядковий JSON-журнал.
      schema:
        type: string
      example: "00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01"
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Обов'язковий ключ ідемпотентності клієнта (О1.4, О2.2 Web). Повтор із тим самим ключем повертає збережений результат
      schema:
        type: string
        maxLength: 128
      example: "idem-req-user-12345"

  headers:
    XRequestIdResponseHeader:
      description: Наскрізний ідентифікатор запиту (О1.6 Web)
      schema:
        type: string
    XInstanceIdResponseHeader:
      description: Ідентифікатор екземпляра додатка за балансувальником nginx (`app-a` або `app-b`)
      schema:
        type: string
        enum: [app-a, app-b]
    RetryAfterHeader:
      description: Рекомендована пауза у секундах перед повторною спробою при переповненні черги (О1.2 РПО)
      schema:
        type: string
      example: "1"

  schemas:
    ProblemDetails:
      type: object
      description: Повідомлення про помилку у форматі RFC 9457 Problem Details (application/problem+json)
      required: [type, title, status, detail, instance]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        error_code:
          type: string
        request_id:
          type: string
        instance_id:
          type: string
        timestamp_utc:
          type: string
          format: date-time

    HealthResponse:
      type: object
      required: [status, instance_id, timestamp_utc, queue_length, queue_capacity, allow_test_overrides]
      properties:
        status:
          type: string
          enum: [ok, shutting_down]
        instance_id:
          type: string
        timestamp_utc:
          type: string
          format: date-time
        queue_length:
          type: integer
        queue_capacity:
          type: integer
        allow_test_overrides:
          type: boolean

    WebStudent:
      type: object
      required: [id, email, full_name, max_disciplines, active_count, active_ects, max_ects]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        full_name:
          type: string
        max_disciplines:
          type: integer
        active_count:
          type: integer
        active_ects:
          type: number
        max_ects:
          type: number

    WebStudentListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WebStudent"

    CreateWebEnrollmentRequest:
      type: object
      required: [group_id]
      properties:
        group_id:
          type: string
          description: Рядковий ідентифікатор групи вибіркової дисципліни (посилання на discipline_group.id). Поле student_id у тілі заборонено (422).

    WebEnrollmentResponse:
      type: object
      required:
        - id
        - student_id
        - group_id
        - discipline_id
        - discipline_title
        - ects
        - status
        - version
        - created_at
        - expires_at
        - created_at_local
        - expires_at_local
        - university_tz
      properties:
        id:
          type: string
          description: Рядковий UUID запису студента на дисципліну (О1.4)
        student_id:
          type: string
        group_id:
          type: string
        discipline_id:
          type: string
        discipline_title:
          type: string
        ects:
          type: number
          description: Точна кількість кредитів ЄКТС дисципліни (numeric(3,1))
        status:
          type: string
          enum: [held, confirmed, expired, cancelled]
        version:
          type: integer
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        created_at_local:
          type: string
          description: Час створення у часовому поясі університету (Europe/Kyiv, ISO 8601)
        expires_at_local:
          type: string
          description: Час закінчення утримання місця у часовому поясі університету (Europe/Kyiv, ISO 8601)
        university_tz:
          type: string
          example: "Europe/Kyiv"
        instance_id:
          type: string
          example: "app-a"
        extra_server_field:
          type: string
          description: Додаткове поле для перевірки ігнорування невідомих полів клієнтом (О1.7)

    WebEnrollmentListResponse:
      type: object
      required: [items, next_cursor, limit, student_id, active_count, max_disciplines, active_ects, max_ects]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WebEnrollmentResponse"
        next_cursor:
          type: [string, "null"]
          description: Непрозорий курсор для переходу до наступної сторінки або null, якщо досягнуто кінця списку (О1.5)
        limit:
          type: integer
        student_id:
          type: string
        active_count:
          type: integer
        max_disciplines:
          type: integer
        active_ects:
          type: number
        max_ects:
          type: number

    WebDisciplineGroup:
      type: object
      required: [id, discipline_id, group_code, seats, available, opens_at, closes_at, opens_at_local, closes_at_local, university_tz, closed, window_active]
      properties:
        id:
          type: string
        discipline_id:
          type: string
        group_code:
          type: string
        seats:
          type: integer
        available:
          type: integer
        opens_at:
          type: string
          format: date-time
        closes_at:
          type: string
          format: date-time
        opens_at_local:
          type: string
        closes_at_local:
          type: string
        university_tz:
          type: string
        closed:
          type: boolean
        window_active:
          type: boolean

    WebDiscipline:
      type: object
      required: [id, code, title, ects, groups]
      properties:
        id:
          type: string
        code:
          type: string
        title:
          type: string
        ects:
          type: number
        groups:
          type: array
          items:
            $ref: "#/components/schemas/WebDisciplineGroup"

    WebDisciplineListResponse:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WebDiscipline"
        next_cursor:
          type: [string, "null"]

    CreateDpcEnrollmentRequest:
      type: object
      required: [student_id, group_id]
      properties:
        student_id:
          type: string
        group_id:
          type: string
        request_id:
          type: string
        enrollment_id:
          type: string
          format: uuid

    DpcEnrollmentAcceptedResponse:
      type: object
      required: [id, student_id, group_id, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        student_id:
          type: string
        group_id:
          type: string
        status:
          type: string
          enum: [queued, processing, done, rejected, failed]
        created_at:
          type: string
          format: date-time

    DpcEnrollmentStatusResponse:
      type: object
      required: [id, student_id, group_id, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        student_id:
          type: string
        group_id:
          type: string
        assigned_group_id:
          type: [string, "null"]
        recorded_in_roster:
          type: boolean
        status:
          type: string
          enum: [queued, processing, done, rejected, failed]
        rejection_reason:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time
        started_at:
          type: [string, "null"]
          format: date-time
        finished_at:
          type: [string, "null"]
          format: date-time
        first_read_at:
          type: [string, "null"]
          format: date-time
        queue_wait_ms:
          type: [number, "null"]
        processing_time_ms:
          type: [number, "null"]
        delivery_wait_ms:
          type: [number, "null"]

    GroupSeatsResponse:
      type: object
      required: [group_id, discipline_title, seats, taken, free_seats, invariant_holds]
      properties:
        group_id:
          type: string
        discipline_title:
          type: string
        seats:
          type: integer
        taken:
          type: integer
        free_seats:
          type: integer
        roster_count:
          type: integer
        invariant_holds:
          type: boolean
        invariant_ok:
          type: boolean
        capacity:
          type: integer
        used:
          type: integer

    DecanateRosterEntry:
      type: object
      required: [request_id, student_id, group_id, discipline_id, discipline_title, ects, assignment_type, created_at]
      properties:
        request_id:
          type: string
          format: uuid
        student_id:
          type: string
        group_id:
          type: string
        discipline_id:
          type: string
        discipline_title:
          type: string
        ects:
          type: number
        enrollment_id:
          type: [string, "null"]
        assignment_type:
          type: string
        created_at:
          type: string
          format: date-time

    AdminResetResponse:
      type: object
      required: [message, unsafe_mode]
      properties:
        message:
          type: string
        unsafe_mode:
          type: boolean
        instance_id:
          type: string

    IntervalStats:
      type: object
      required: [description, sample_count, mean_ms, p50_ms, p95_ms, p99_ms]
      properties:
        description:
          type: string
        sample_count:
          type: integer
        mean_ms:
          type: number
        p50_ms:
          type: number
        p95_ms:
          type: number
        p99_ms:
          type: number

    ServiceMetricsResponse:
      type: object
      required: [service, instance_id, timestamp_utc, configuration, queue_length, in_processing, counters, intervals_ms, littles_law]
      properties:
        service:
          type: string
        instance_id:
          type: string
        timestamp_utc:
          type: string
          format: date-time
        configuration:
          type: object
        queue_length:
          type: integer
        in_flight:
          type: integer
        in_processing:
          type: integer
        rejected:
          type: integer
        counters:
          type: object
        intervals_ms:
          type: object
          properties:
            queue_wait_ms:
              $ref: "#/components/schemas/IntervalStats"
            processing_time_ms:
              $ref: "#/components/schemas/IntervalStats"
            delivery_wait_ms:
              $ref: "#/components/schemas/IntervalStats"
            full_domain_execution_ms:
              $ref: "#/components/schemas/IntervalStats"
        littles_law:
          type: object

paths:
  /:
    get:
      operationId: getApiDiscovery
      tags: [Shared]
      summary: Кореневий опис сервісу та перелік основних маршрутів API
      description: Повертає метадані екземпляра API та перелік доступних маршрутів. Окремий вебклієнт запускається поза Docker Compose (§1.2).
      responses:
        "200":
          description: Опис сервісу та маршрутів
          content:
            application/json:
              example:
                service: "C10 Enrollment Service (Web + DPC, Lab 1)"
                instance_id: "app-a"
                standalone_client: "Запустіть окремий клієнт поза Docker Compose: pwsh client/start_client.ps1 (http://localhost:3000)"

  /health:
    get:
      operationId: getHealth
      tags: [Shared]
      summary: Перевірка живучості сервісу (О1.6 Web та О1.2 РПО)
      description: Миттєво відповідає з пам'яті процесу без звернення до бази даних (p95 <= 100 мс під піковим навантаженням).
      parameters:
        - $ref: "#/components/parameters/XRequestIdHeader"
        - $ref: "#/components/parameters/TraceparentHeader"
      responses:
        "200":
          description: Сервіс живий і готовий приймати запити
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestIdResponseHeader"
            X-Instance-Id:
              $ref: "#/components/headers/XInstanceIdResponseHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: "ok"
                instance_id: "app-a"
                timestamp_utc: "2026-10-30T08:00:00Z"
                queue_length: 0
                queue_capacity: 100
                allow_test_overrides: false

  /health-app-a:
    get:
      operationId: getHealthAppA
      tags: [Shared]
      summary: Пряма перевірка живучості навантаженого екземпляра app-a (О1.2 РПО)
      description: Маршрутизується Nginx виключно на головний обчислювальний вузол `dpc_backend` (app-a), виключаючи ненавантажений app-b для чистоти вимірювання перцентиля затримки p95.
      parameters:
        - $ref: "#/components/parameters/XRequestIdHeader"
        - $ref: "#/components/parameters/TraceparentHeader"
      responses:
        "200":
          description: Вузол app-a живий і відповідає під час навантаження черги
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestIdResponseHeader"
            X-Instance-Id:
              $ref: "#/components/headers/XInstanceIdResponseHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: "ok"
                instance_id: "app-a"
                timestamp_utc: "2026-10-30T08:00:00Z"
                queue_length: 100
                queue_capacity: 100
                allow_test_overrides: false

  /health-app-b:
    get:
      operationId: getHealthAppB
      tags: [Shared]
      summary: Пряма перевірка живучості екземпляра app-b (О1.6 Web)
      description: Маршрутизується Nginx виключно на обчислювальний вузол `app-b` за балансувальником для ізольованої перевірки його стану та конфігурації.
      parameters:
        - $ref: "#/components/parameters/XRequestIdHeader"
        - $ref: "#/components/parameters/TraceparentHeader"
      responses:
        "200":
          description: Вузол app-b живий і відповідає
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestIdResponseHeader"
            X-Instance-Id:
              $ref: "#/components/headers/XInstanceIdResponseHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: "ok"
                instance_id: "app-b"
                timestamp_utc: "2026-10-30T08:00:00Z"
                queue_length: 0
                queue_capacity: 100
                allow_test_overrides: false

  /v1/students:
    get:
      operationId: listPrecreatedStudents
      tags: [Web]
      summary: Список студентів у БД із захистом персональних даних (Web О1.4, О3.2)
      description: |
        Повертає перелік студентів із дотриманням рольового доступу (RBAC):
        - Персонал (із заголовком Authorization: Bearer <token>) має право переглядати повний список студентів або фільтрувати за ?student_id=...;
        - Студент (із заголовком X-User-Id — навчальна емуляція контексту користувача для ЛР1 до впровадження JWT у ЛР3) має доступ виключно до власного профілю (спроба отримати чужі дані через ?student_id=... повертає 403 Forbidden);
        - Неавтентифіковані запити (без валідного токена або заголовка) відхиляються зі статусом 401 Unauthorized.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XRequestIdHeader"
        - $ref: "#/components/parameters/XUserIdOptionalHeader"
        - $ref: "#/components/parameters/TraceparentHeader"
        - name: student_id
          in: query
          required: false
          description: Фільтрація за ідентифікатором студента (доступно персоналу або для власного ID студента)
          schema:
            type: string
      responses:
        "200":
          description: Список студентів (для персоналу — повний або відфільтрований, для студента — лише власний профіль)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebStudentListResponse"
              example:
                items:
                  - id: "student-1"
                    email: "timur.zinkivskyi@inf.edu.ua"
                    full_name: "Зінківський Тимур Євгенійович (ІТІНФ-23-2)"
                    max_disciplines: 5
                    active_count: 1
                    active_ects: 6.0
                    max_ects: 30.0
        "401":
          description: Неавторизований доступ (відсутній токен або заголовок X-User-Id)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "403":
          description: Доступ заборонено (студент намагається переглянути чужі дані)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /v1/students/{id}:
    get:
      operationId: getStudentById
      tags: [Web]
      summary: Отримання профілю конкретного студента (Web О3.2)
      description: |
        Повертає профіль студента за його ідентифікатором:
        - Персонал (із Bearer токеном) може отримати профіль будь-якого студента;
        - Студент (із X-User-Id) може отримати виключно власний профіль (спроба запитати чуже ID повертає 403 Forbidden);
        - Неавтентифіковані запити відхиляються зі статусом 401 Unauthorized.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Ідентифікатор студента
          schema:
            type: string
        - $ref: "#/components/parameters/XRequestIdHeader"
