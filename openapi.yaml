  /v1/enrollments/{id}/registrations:
    post:
      operationId: registerEnrollmentToDecanate
      tags: [Web, DPC]
      summary: Асинхронна реєстрація попереднього запису у відомості деканату через чергу РПО (Web C10, стор. 37)
      description: |
        Спільна наскрізна операція Web + РПО за темою C10. Приймає запис студента у стані held,
        перевіряє його валідність і ставить у чергу воркерів РПО для внесення до офіційної відомості
        деканату (decanate_roster) та фіксації статусу confirmed.

        Семантичне розмежування:
        - Прямий POST /v1/enrollments/{id}/confirm — базова операція Web-контуру (підтвердження вибору студентом).
        - POST /v1/enrollments/{id}/registrations — наскрізна інтеграція Web + РПО (внесення до відомості через чергу).

        Якщо запис вже переведено у confirmed (наприклад, прямим confirm), повторний виклик повертає
        409 Conflict (enrollment_not_held), оскільки запис уже підтверджено і він не може потрапити до відомості двічі.

        Підтримка Idempotency-Key:
        - При повторі з тим самим Idempotency-Key повертається 202 Accepted зі збереженим requestId і Location
          як до початку обробки, так і після її завершення (done), без додаткового споживання слотів черги.
        - При зміні параметрів (студент, запис) повертається 409 Conflict (idempotency_conflict).
      x-course: registrations
      parameters:
        - name: id
          in: path
          required: true
          description: Рядковий UUID Web-запису студента
          schema:
            type: string
