  /v1/groups/{id}/distribute-second-choice:
    post:
      operationId: distributeSecondChoiceAfterGroupClose
      tags: [DPC]
      summary: Окремий механізм розподілу студентів у групи другого вибору після закриття запису (С10 п. 2, 6 РПО)
      description: |
        Виконується виключно після закриття запису в основну групу `{id}` (`closed = true`).
        Розподільник DPC тією самою атомарною умовою місць зменшує `available` у групі другого вибору (`second_choice_group_id`),
        перевіряє обмеження `max_disciplines` (K) та `30.0` ЄКТС, створює підтверджений запис у `enrollment`
        (щоб Web не міг повторно записати того самого студента) та фіксує результат у відомості деканату (`decanate_roster`) за `request_id`.
      x-course: dpc
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Ідентифікатор закритої основної групи першого вибору
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecondChoiceDistributionRequest"
            examples:
              distribute_single:
                summary: Розподіл конкретного студента у групу другого вибору після закриття основної групи
                value:
                  student_id: "student-3"
                  second_choice_group_id: "DISC-SEC-04"
      responses:
        "200":
          description: Результат розподілу за групами другого вибору
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecondChoiceDistributionResponse"
              example:
                primary_group_id: "DISC-SEC-03"
                primary_group_closed: true
                distributed_count: 1
                rejected_count: 0
                items:
                  - request_id: "ef1db6d7-fa03-4dca-be78-686dccc0ab29"
                    student_id: "student-3"
                    primary_group_id: "DISC-SEC-03"
                    second_choice_group_id: "DISC-SEC-04"
                    status: "done"
                    enrollment_id: "8f14e45f-ceea-467a-9a38-1b241d45b001"
                    recorded_in_roster: true
                    rejection_reason: null
        "401":
          description: Відсутній або недійсний Bearer-токен
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: Основну групу не знайдено
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "409":
          description: Основна група ще відкрита (розподіл можливий лише після закриття запису)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

