  /v1/compute:
    post:
      operationId: computeIntensityIntegral
      tags: [DPC]
      summary: Паралельне чисельне інтегрування функції інтенсивності потоку заявок C10 методом трапецій (О2.1–О2.4 РПО)
      description: >-
        Обчислює визначений інтеграл функції інтенсивності потоку заявок λ(t) = B + A·exp(-t/τ) на відрізку [a, b] (де 0 <= a <= b <= T)
        складеною формулою трапецій із розбиттям на n підінтервалів між workers (1, 2 або 4) окремими процесами ОС.
        Повертає чисельне значення інтеграла value, аналітичний еталон reference, абсолютну (abs_error) і відносну (rel_error) похибки
        та повний час виконання wall_s (duration_ms). Підтримує режими агрегації результатів О2.4: local, lock, none.
      x-course: compute
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XRequestIdHeader"
        - $ref: "#/components/parameters/TraceparentHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComputeRequest"
            examples:
              default_local:
                summary: Паралельне обчислення методу трапецій у режимі локальних сум (local)
                value:
                  a: 0.0
                  b: 1.0
                  n: 100000
                  workers: 2
                  method: "trapezoid"
                  order: "natural"
                  mode: "local"
              shared_lock:
                summary: Оновлення спільної суми у міжпроцесній пам'яті під блокуванням (lock, О2.4)
                value:
                  a: 0.0
                  b: 1.0
                  n: 100000
                  workers: 4
                  method: "trapezoid"
                  order: "natural"
                  mode: "lock"
              shared_none:
                summary: Незахищене оновлення спільної суми у міжпроцесній пам'яті без синхронізації (none, О2.4)
                value:
                  a: 0.0
                  b: 1.0
                  n: 100000
                  workers: 4
                  method: "trapezoid"
                  order: "natural"
                  mode: "none"
      responses:
        "200":
          description: Результат паралельного чисельного інтегрування та порівняння з аналітичним еталоном
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestIdResponseHeader"
            X-Instance-Id:
              $ref: "#/components/headers/XInstanceIdResponseHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComputeResponse"
              example:
                value: 52.58129098040162
                reference: 52.581290980397654
                abs_error: 3.9648e-12
                error: 3.9648e-12
                rel_error: 7.5403e-14
                wall_s: 0.0852
                duration_ms: 85.2
                workers: 2
                method: "trapezoid"
                n: 100000
                order: "natural"
                mode: "local"
                a: 0.0
                b: 1.0
                state: "done"
                instance_id: "app-a"
                result:
                  value: 52.58129098040162
                  reference: 52.581290980397654
                  abs_error: 3.9648e-12
                  error: 3.9648e-12
                  rel_error: 7.5403e-14
                  wall_s: 0.0852
                  duration_ms: 85.2
                  workers: 2
                  method: "trapezoid"
                  n: 100000
                  order: "natural"
                  mode: "local"
        "400":
          description: Синтаксично некоректний JSON або некоректні параметри обчислення (n < 1, workers не в {1, 2, 4}, a > b, інтервал поза [0, T], непідтримуваний method/order/mode)
