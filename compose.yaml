services:
  postgres:
    image: postgres:16-alpine
    container_name: dpc-c10-postgres
    environment:
      POSTGRES_USER: dpc_user
      POSTGRES_PASSWORD: dpc_password
      POSTGRES_DB: dpc_c10
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init_test_db.sql:/docker-entrypoint-initdb.d/init_test_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dpc_user -d dpc_c10"]
      interval: 3s
      timeout: 3s
      retries: 10

  app-a:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dpc-c10-api
    hostname: app-a
    ports:
      - "8001:8080"
    networks:
      default:
        aliases:
          - api
          - app-a
    depends_on:
      postgres:
        condition: service_healthy
      ray-head:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Development}"
      ASPNETCORE_URLS: "http://+:8080"
      INSTANCE_ID: "app-a"
      DB_CONNECTION_STRING: "${DB_CONNECTION_STRING:-Host=postgres;Port=5432;Database=dpc_c10;Username=dpc_user;Password=dpc_password;Maximum Pool Size=20}"
      API_AUTH_TOKEN: "${API_AUTH_TOKEN:-secret-c10-token-2026}"
      QUEUE_CAPACITY: "${QUEUE_CAPACITY:-100}"
      WORKERS: "${WORKERS:-3}"
      UNSAFE_MODE: "${UNSAFE_MODE:-false}"
      EXECUTION_MODEL: "${EXECUTION_MODEL:-async_tasks}"
      QUEUE_ENGINE: "${QUEUE_ENGINE:-custom_monitor}"
      SLOW_CALL_MIN_MS: "${SLOW_CALL_MIN_MS:-200}"
      SLOW_CALL_MAX_MS: "${SLOW_CALL_MAX_MS:-700}"
      ALLOW_TEST_OVERRIDES: "${ALLOW_TEST_OVERRIDES:-false}"
      ENABLE_WORKERS: "true"
      FAULTS: "${FAULTS:-off}"
      FAULTS_DIR: "/faults"
      IDEMPOTENCY_KEY_TTL_MINUTES: "${IDEMPOTENCY_KEY_TTL_MINUTES:-1440}"
      IN_FLIGHT_LIMIT: "${IN_FLIGHT_LIMIT:-3}"
      RAY_DISPATCHER_URL: "${RAY_DISPATCHER_URL:-http://ray-head:8266}"
      RAY_TASK_MAX_RETRIES: "${RAY_TASK_MAX_RETRIES:-3}"
      INTERNAL_RECEIVER_URL: "http://app-a:8080/v1/internal/ray-effect-receiver"
      INTERNAL_RECEIVER_SECRET: "${INTERNAL_RECEIVER_SECRET:-c10-internal-ray-secret}"
      AUTH_TOKEN_TTL_MINUTES: "${AUTH_TOKEN_TTL_MINUTES:-120}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}"
      DEMO_STUDENT_PASSWORD: "${DEMO_STUDENT_PASSWORD:-StudentPass2026!}"
      DEMO_STAFF_PASSWORD: "${DEMO_STAFF_PASSWORD:-StaffPass2026!}"
    volumes:
      - ./faults:/faults
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 3s
    stop_grace_period: 60s

  app-b:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dpc-c10-app-b
    hostname: app-b
    ports:
      - "8002:8080"
    networks:
      default:
        aliases:
          - app-b
    depends_on:
      postgres:
        condition: service_healthy
      ray-head:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Development}"
      ASPNETCORE_URLS: "http://+:8080"
      INSTANCE_ID: "app-b"
      DB_CONNECTION_STRING: "${DB_CONNECTION_STRING:-Host=postgres;Port=5432;Database=dpc_c10;Username=dpc_user;Password=dpc_password;Maximum Pool Size=20}"
      API_AUTH_TOKEN: "${API_AUTH_TOKEN:-secret-c10-token-2026}"
      QUEUE_CAPACITY: "${QUEUE_CAPACITY:-100}"
      WORKERS: "${WORKERS:-3}"
      UNSAFE_MODE: "${UNSAFE_MODE:-false}"
      EXECUTION_MODEL: "${EXECUTION_MODEL:-async_tasks}"
      QUEUE_ENGINE: "${QUEUE_ENGINE:-custom_monitor}"
      SLOW_CALL_MIN_MS: "${SLOW_CALL_MIN_MS:-200}"
      SLOW_CALL_MAX_MS: "${SLOW_CALL_MAX_MS:-700}"
      ALLOW_TEST_OVERRIDES: "${ALLOW_TEST_OVERRIDES:-false}"
      ENABLE_WORKERS: "false"
      FAULTS: "${FAULTS:-off}"
      FAULTS_DIR: "/faults"
      IDEMPOTENCY_KEY_TTL_MINUTES: "${IDEMPOTENCY_KEY_TTL_MINUTES:-1440}"
      IN_FLIGHT_LIMIT: "${IN_FLIGHT_LIMIT:-3}"
      RAY_DISPATCHER_URL: "${RAY_DISPATCHER_URL:-http://ray-head:8266}"
      RAY_TASK_MAX_RETRIES: "${RAY_TASK_MAX_RETRIES:-3}"
      INTERNAL_RECEIVER_URL: "http://app-a:8080/v1/internal/ray-effect-receiver"
      INTERNAL_RECEIVER_SECRET: "${INTERNAL_RECEIVER_SECRET:-c10-internal-ray-secret}"
      AUTH_TOKEN_TTL_MINUTES: "${AUTH_TOKEN_TTL_MINUTES:-120}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}"
      DEMO_STUDENT_PASSWORD: "${DEMO_STUDENT_PASSWORD:-StudentPass2026!}"
      DEMO_STAFF_PASSWORD: "${DEMO_STAFF_PASSWORD:-StaffPass2026!}"
    volumes:
      - ./faults:/faults
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 3s
    stop_grace_period: 60s

  ray-head:
    build:
      context: .
      dockerfile: ray_worker/Dockerfile
    container_name: dpc-c10-ray-head
    hostname: ray-head
    shm_size: "512mb"
    ports:
      - "127.0.0.1:8266:8266"
    command:
      - sh
      - -c
      - "ray start --head --port=6379 --include-dashboard=false --num-cpus=0 && RAY_ADDRESS=auto uvicorn app:app --host 0.0.0.0 --port 8266"
    environment:
      RAY_ADDRESS: "auto"
      FAULTS_DIR: "/faults"
      API_AUTH_TOKEN: "${API_AUTH_TOKEN:-secret-c10-token-2026}"
      INTERNAL_RECEIVER_URL: "http://app-a:8080/v1/internal/ray-effect-receiver"
      INTERNAL_RECEIVER_SECRET: "${INTERNAL_RECEIVER_SECRET:-c10-internal-ray-secret}"
    volumes:
      - ./faults:/faults
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8266/health"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 8s

  ray-worker:
    build:
      context: .
      dockerfile: ray_worker/Dockerfile
    container_name: dpc-c10-ray-worker
    hostname: ray-worker
    shm_size: "512mb"
    depends_on:
      ray-head:
        condition: service_healthy
    command:
      - sh
      - -c
      - "ray start --address=ray-head:6379 --num-cpus=4 --block"
    environment:
      FAULTS_DIR: "/faults"
      API_AUTH_TOKEN: "${API_AUTH_TOKEN:-secret-c10-token-2026}"
      INTERNAL_RECEIVER_URL: "http://app-a:8080/v1/internal/ray-effect-receiver"
      INTERNAL_RECEIVER_SECRET: "${INTERNAL_RECEIVER_SECRET:-c10-internal-ray-secret}"
    volumes:
      - ./faults:/faults

  nginx:
    image: nginx:1.27-alpine
    container_name: dpc-c10-nginx
    depends_on:
      app-a:
        condition: service_healthy
      app-b:
        condition: service_healthy
    ports:
      - "8080:8080"
      - "8000:8000"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  pgdata:
